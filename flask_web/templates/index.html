<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheating Detection - Upload Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- VIBRANT FORMAL THEME (CSS ONLY CHANGE) --- */
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); /* Cyan to Blue */
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif; /* Cleaner font */
            background-color: var(--bg-dark);
            /* Deep Tech Background */
            background-image: 
                radial-gradient(at 47% 33%, hsl(220.87, 69.17%, 23.53%) 0, transparent 59%), 
                radial-gradient(at 82% 65%, hsl(218.11, 74.4%, 18.43%) 0, transparent 55%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        h1 {
            color: var(--text-main);
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
            /* Gradient Text Effect */
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .upload-area {
            border: 2px dashed rgba(6, 182, 212, 0.3); /* Cyan dashed border */
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .upload-area:hover {
            border-color: #06b6d4;
            background: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.1) inset;
            transform: translateY(-2px);
        }

        .upload-area.dragging {
            border-color: #06b6d4;
            background: rgba(6, 182, 212, 0.1);
        }

        .upload-icon {
            font-size: 50px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(6,182,212,0.5));
        }

        .upload-text {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .file-info {
            color: var(--text-muted);
            font-size: 13px;
        }

        input[type="file"] { display: none; }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.6);
            filter: brightness(1.1);
        }

        .btn:disabled {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .file-preview {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: var(--glass-border);
        }

        .file-preview.show { display: block; }

        .file-name {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .file-size {
            color: var(--text-muted);
            font-size: 13px;
        }

        .progress-bar {
            display: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar.show { display: block; }

        .progress-fill {
            height: 100%;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .status-message {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 12px;
            display: none;
            font-weight: 500;
            backdrop-filter: blur(5px);
        }

        .status-message.show { display: block; }

        .status-message.success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loading {
            text-align: center;
            margin-top: 25px;
            display: none;
        }

        .loading.show { display: block; }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #06b6d4; /* Cyan spinner */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Cheating Detection System</h1>
        <p class="subtitle">Upload your video for analysis</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📹</div>
            <p class="upload-text">Drag & Drop video here or click to browse</p>
            <p class="file-info">Supported: MP4, AVI, MOV, MKV, FLV (Max 500MB)</p>
        </div>

        <input type="file" id="fileInput" accept=".mp4,.avi,.mov,.mkv,.flv">

        <div class="file-preview" id="filePreview">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText"></div>

        <div class="status-message" id="statusMessage"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing video... Please wait</p>
        </div>

        <button class="btn" id="processBtn" disabled>Select a video first</button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const processBtn = document.getElementById('processBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const statusMessage = document.getElementById('statusMessage');
        const loading = document.getElementById('loading');

        let selectedFile = null;
        let uploadedFilename = null;

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File selected via input
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            handleFile(e.dataTransfer.files[0]);
        });

        // Handle file
        function handleFile(file) {
            if (!file) return;
            
            const validTypes = ['video/mp4', 'video/avi', 'video/quicktime', 'video/x-matroska', 'video/x-flv'];
            if (!validTypes.includes(file.type) && !file.name.match(/\.(mp4|avi|mov|mkv|flv)$/i)) {
                showStatus('Invalid file type! Please upload a video file.', 'error');
                return;
            }

            if (file.size > 500 * 1024 * 1024) {
                showStatus('File too large! Maximum size is 500MB.', 'error');
                return;
            }

            selectedFile = file;
            
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            filePreview.classList.add('show');

            // Enable process button
            processBtn.textContent = 'Upload & Process Video';
            processBtn.disabled = false;

            uploadFile(file);
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('video', file);

            progressBar.classList.add('show');
            const xhr = new XMLHttpRequest();

            // Progress tracking
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = (e.loaded / e.total) * 100;
                    progressFill.style.width = percent + '%';
                    progressText.textContent = `Uploading: ${Math.round(percent)}%`;
                }
            });

            // Upload complete
            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    uploadedFilename = response.filename;
                    showStatus('Upload successful! Click process to analyze.', 'success');
                    processBtn.textContent = 'Process Video';
                } else {
                    const error = JSON.parse(xhr.responseText);
                    showStatus('Upload failed: ' + error.error, 'error');
                    resetUpload();
                }
            });

            xhr.addEventListener('error', () => {
                showStatus('Upload failed. Please try again.', 'error');
                resetUpload();
            });

            xhr.open('POST', '/upload');
            xhr.send(formData);
        }

        // Process video
        processBtn.addEventListener('click', () => {
            if (!uploadedFilename) {
                showStatus('Please upload a video first', 'error');
                return;
            }

            processBtn.disabled = true;
            loading.classList.add('show');
            statusMessage.classList.remove('show');

            fetch(`/process/${uploadedFilename}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = `/results/${uploadedFilename}`;
                    } else {
                        showStatus('Processing failed: ' + data.error, 'error');
                        processBtn.disabled = false;
                        loading.classList.remove('show');
                    }
                })
                .catch(error => {
                    showStatus('Error: ' + error, 'error');
                    processBtn.disabled = false;
                    loading.classList.remove('show');
                });
        });

        // Helper functions
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message show ' + type;
        }

        function resetUpload() {
            selectedFile = null;
            uploadedFilename = null;
            fileInput.value = '';
            filePreview.classList.remove('show');
            progressBar.classList.remove('show');
            processBtn.disabled = true;
            processBtn.textContent = 'Select a video first';
        }
    </script>
</body>
</html>
