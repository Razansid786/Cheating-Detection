<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- VIBRANT FORMAL THEME (CSS ONLY CHANGE) --- */
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            /* Gradients for status */
            --success-grad: linear-gradient(135deg, #059669 0%, #10b981 100%);
            --alert-grad: linear-gradient(135deg, #dc2626 0%, #f97316 100%);
            --btn-grad: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            /* Deep Tech Background */
            background-image: 
                radial-gradient(at 47% 33%, hsl(220.87, 69.17%, 23.53%) 0, transparent 59%), 
                radial-gradient(at 82% 65%, hsl(218.11, 74.4%, 18.43%) 0, transparent 55%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--text-main);
            text-align: center;
            margin-bottom: 40px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Status Card Styles to match JS .success and .alert */
        .status-card {
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Success State */
        .status-card.success {
            background: var(--success-grad);
            border: none;
            color: white;
            box-shadow: 0 10px 40px -10px rgba(16, 185, 129, 0.6);
        }

        /* Alert State */
        .status-card.alert {
            background: var(--alert-grad);
            border: none;
            color: white;
            box-shadow: 0 10px 40px -10px rgba(220, 38, 38, 0.6);
        }

        .status-icon {
            font-size: 60px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }
        
        /* Force styling on the H3 inside status card */
        .status-card h3 {
            color: white !important; /* Override any potential inheritance */
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .status-card p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .result-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 20px;
            border: var(--glass-border);
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.3);
        }

        .result-card h4 {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 500;
            color: var(--text-muted);
        }

        .value {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        /* Make important numbers pop */
        #cheatingPersons { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.5); }
        #totalPersons { color: #22d3ee; }

        .incidents-section {
            margin-top: 30px;
        }

        .incidents-section h4 {
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .incident-item {
            background: rgba(220, 38, 38, 0.15); /* Red glass */
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(220, 38, 38, 0.3);
            display: flex; /* Ensure layout matches new CSS */
            flex-direction: column; /* Keep column for the inner html structure */
        }

        /* Since the JS injects .incident-info inside .incident-item, we style that */
        .incident-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .incident-time {
            font-weight: 600;
            color: #fca5a5; /* Light red */
        }

        .incident-confidence {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            padding: 5px 12px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(220, 38, 38, 0.4);
        }

        .video-section {
            margin-top: 40px;
            padding: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: var(--glass-border);
            /* Cyan glow */
            box-shadow: 0 0 30px -10px rgba(6, 182, 212, 0.2);
        }

        .video-section h4 {
            color: var(--text-muted);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        video {
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .actions {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            font-weight: 600;
            min-width: 180px;
            text-align: center;
        }

        /* Analyze Another (Primary) */
        .btn-primary {
            background: var(--btn-grad);
            color: white;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.6);
            filter: brightness(1.1);
        }

        /* Download Buttons (Secondary) */
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        
        /* Specific override for the green download button in original HTML */
        button#downloadVideo {
            background: rgba(16, 185, 129, 0.1) !important;
            border: 1px solid rgba(16, 185, 129, 0.4) !important;
            color: #34d399 !important;
        }
        button#downloadVideo:hover {
            background: rgba(16, 185, 129, 0.2) !important;
            transform: translateY(-3px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Exit Button */
        .btn-exit {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        .btn-exit:hover {
            background: #b91c1c;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.6);
        }

        .loading-results {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #06b6d4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Cheating Detection Results</h1>

        <div class="loading-results" id="loadingResults">
            <div class="spinner"></div>
            <p style="color: #94a3b8;">Loading results...</p>
        </div>

        <div class="results-content" id="resultsContent" style="display: none;">
            <div class="status-card" id="statusCard">
                <div class="status-icon" id="statusIcon"></div>
                <h3 id="statusTitle"></h3>
                <p id="statusMessage"></p>
            </div>

            <div class="results-grid">
                <div class="result-card">
                    <h4>Video Information</h4>
                    <div class="info-item">
                        <span class="label">Total Frames:</span>
                        <span class="value" id="totalFrames"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Frames Analyzed:</span>
                        <span class="value" id="framesAnalyzed"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Processing Time:</span>
                        <span class="value" id="processingTime"></span>
                    </div>
                </div>

                <div class="result-card">
                    <h4>Detection Summary</h4>
                    <div class="info-item">
                        <span class="label">Total Persons:</span>
                        <span class="value" id="totalPersons"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Cheating Persons:</span>
                        <span class="value" id="cheatingPersons"></span>
                    </div>
                </div>
            </div>

            <div class="incidents-section" id="incidentsSection" style="display: none;">
                <h4>Detected Incidents</h4>
                <div class="incidents-list" id="incidentsList"></div>
            </div>

            <div class="video-section">
                <h4>Processed Video</h4>
                <video controls id="outputVideo">
                    <source src="{{ url_for('static', filename=output_video) }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="analyzeAnother">Analyze Another Video</button>
                <button class="btn btn-secondary" id="downloadReport">Download Report</button>
                <button class="btn btn-secondary" id="downloadVideo">Download Video</button>
                <button class="btn btn-exit" id="exitApp">Exit App</button>
            </div>
        </div>
    </div>

    <script>
    const result_summary_str = '{{ summary|safe }}';
    const filename = "{{ filename }}";
    const output_video = "{{ output_video }}";

    console.log('Raw summary string:', result_summary_str);
    console.log('Filename:', filename);
    console.log('Output video path:', output_video);

    // Parse the string to object
    let result_summary = {};
    try {
        result_summary = JSON.parse(result_summary_str);
        console.log('✓ Parsed result summary:', result_summary);
        console.log('  Total persons:', result_summary.total_persons);
        console.log('  Cheating persons:', result_summary.cheating_persons);
        console.log('  Total frames:', result_summary.total_frames);
    } catch (error) {
        console.error('❌ Failed to parse summary:', error);
        console.log('Raw summary string:', result_summary_str);
        result_summary = {
            total_persons: 0,
            cheating_persons: [],
            total_frames: 0,
            processing_time: 0
        };
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function loadResults() {
        document.getElementById('loadingResults').style.display = 'none';
        document.getElementById('resultsContent').style.display = 'block';

        console.log('Loading results with summary:', result_summary);

        // Check if data exists
        if (!result_summary || typeof result_summary !== 'object') {
            alert('Error: No summary data received from server');
            return;
        }

        // If backend error
        if (result_summary.error) {
            console.warn('Summary error:', result_summary.error);
            // Still show the UI with default values
        }

        // Status card
        const statusCard = document.getElementById('statusCard');
        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');

        if (result_summary.cheating_persons && result_summary.cheating_persons.length > 0) {
            statusCard.classList.add('alert');
            statusIcon.textContent = '⚠️';
            statusTitle.textContent = 'Cheating Detected';
            statusMessage.textContent = 
                `Detected ${result_summary.cheating_persons.length} suspicious individual(s).`;
        } else {
            statusCard.classList.add('success');
            statusIcon.textContent = '✅';
            statusTitle.textContent = 'No Cheating Detected';
            statusMessage.textContent = 'No suspicious behavior detected in the video.';
        }

        const totalFrames = result_summary.total_frames || 'N/A';
        const processingTime = result_summary.processing_time;
        const totalPersons = result_summary.total_persons || 0;
        const cheatingPersons = result_summary.cheating_persons ? result_summary.cheating_persons.length : 0;

        console.log('Setting UI values:');
        console.log('  Total frames:', totalFrames);
        console.log('  Processing time:', processingTime);
        console.log('  Total persons:', totalPersons);
        console.log('  Cheating persons:', cheatingPersons);

        document.getElementById('totalFrames').textContent = totalFrames;
        document.getElementById('framesAnalyzed').textContent = totalFrames;
        document.getElementById('processingTime').textContent = 
            processingTime ? `${processingTime.toFixed(2)}s` : 'N/A';
        document.getElementById('totalPersons').textContent = totalPersons;
        document.getElementById('cheatingPersons').textContent = cheatingPersons;

        // Show incidents if any
        if (result_summary.cheating_persons && result_summary.cheating_persons.length > 0) {
            const incidentsSection = document.getElementById('incidentsSection');
            const incidentsList = document.getElementById('incidentsList');

            incidentsSection.style.display = 'block';

            result_summary.cheating_persons.forEach(personId => {
                const item = document.createElement('div');
                item.className = 'incident-item';
                item.innerHTML = `
                    <div class="incident-info">
                        <span class="incident-time">Person ID: ${personId}</span>
                        <span class="incident-confidence">Flagged</span>
                    </div>
                `;
                incidentsList.appendChild(item);
            });
        }

        // Setup video with error handling
        setupVideo();
    }

    function setupVideo() {
        const videoElement = document.getElementById('outputVideo');
        const videoSource = videoElement.querySelector('source');
        
        console.log('Video source URL:', videoSource.src);

        // Add event listeners for video debugging
        videoElement.addEventListener('loadeddata', () => {
            console.log('✓ Video loaded successfully');
            console.log('  Duration:', videoElement.duration, 'seconds');
            console.log('  Dimensions:', videoElement.videoWidth, 'x', videoElement.videoHeight);
        });

        videoElement.addEventListener('error', (e) => {
            console.error('❌ Video loading error:', e);
            console.error('  Error code:', videoElement.error ? videoElement.error.code : 'unknown');
            console.error('  Error message:', videoElement.error ? videoElement.error.message : 'unknown');
            
            // Display error message to user
            const videoSection = document.querySelector('.video-section');
            videoSection.innerHTML = `
                <h4>Processed Video</h4>
                <div style="background: rgba(220, 38, 38, 0.2); color: #fca5a5; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid rgba(220, 38, 38, 0.4);">
                    <p><strong>⚠️ Video Loading Error</strong></p>
                    <p>Could not load the processed video.</p>
                    <p style="font-size: 12px; margin-top: 10px;">Path: ${output_video}</p>
                    <p style="font-size: 12px;">Check browser console for details.</p>
                </div>
            `;
        });

        videoElement.addEventListener('loadstart', () => {
            console.log('Video loading started...');
        });

        videoElement.addEventListener('canplay', () => {
            console.log('✓ Video can play');
        });
    }
    // Handle Analyze Another Video button
    document.getElementById('analyzeAnother').addEventListener('click', async function() {
        const button = this;
        const originalText = button.textContent;
        
        // Show loading state
        button.textContent = 'Cleaning up...';
        button.disabled = true;

        try {
            // Delete files before navigating
            const response = await fetch(`/delete/${filename}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                console.log('✓ Files deleted successfully');
            } else {
                console.warn('⚠️ Some files may not have been deleted');
            }
            
            // Navigate to index page
            window.location.href = "{{ url_for('index') }}";
            
        } catch (error) {
            console.error('❌ Cleanup error:', error);
            // Still navigate to index even on error
            window.location.href = "{{ url_for('index') }}";
        }
    });

    // Handle Exit App button
    document.getElementById('exitApp').addEventListener('click', async function() {
        const button = this;
        const originalText = button.textContent;
        
        // Show loading state
        button.textContent = 'Exiting...';
        button.disabled = true;

        try {
            // Delete files before exiting
            const response = await fetch(`/delete/${filename}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                console.log('✓ Files deleted successfully');
            } else {
                console.warn('⚠️ Some files may not have been deleted');
            }
            
            window.close();
            
            setTimeout(() => {
                alert('You can now safely close this browser tab.');
            }, 500);
            
        } catch (error) {
            console.error('❌ Exit error:', error);
            window.close();
            setTimeout(() => {
                alert('You can now safely close this browser tab.');
            }, 500);
        }
    });


    document.getElementById('downloadReport').addEventListener('click', () => {
        let report = `CHEATING DETECTION REPORT\n`;
        report += `========================\n\n`;
        report += `Filename: ${filename}\n`;
        report += `Total Persons: ${result_summary.total_persons || 0}\n`;
        report += `Cheating Persons: ${result_summary.cheating_persons ? result_summary.cheating_persons.length : 0}\n`;
        report += `Total Frames: ${result_summary.total_frames || 0}\n`;
        report += `Processing Time: ${result_summary.processing_time ? result_summary.processing_time.toFixed(2) : 'N/A'}s\n\n`;
        
        if (result_summary.cheating_persons && result_summary.cheating_persons.length > 0) {
            report += `Cheating Person IDs:\n`;
            result_summary.cheating_persons.forEach(id => {
                report += `- Person ${id}\n`;
            });
        }

        // Download as text file
        const blob = new Blob([report], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `report_${filename}.txt`;
        a.click();
        window.URL.revokeObjectURL(url);
    });
    document.getElementById('downloadVideo').addEventListener('click', function() {
        const button = this;
        const downloadUrl = `/download_result/${filename}`;
        
        // Create temporary link to trigger download
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = downloadUrl;
        document.body.appendChild(a);
        a.click();
        
        // Cleanup
        setTimeout(() => {
            document.body.removeChild(a);
        }, 100);
    });

    // Load results on page load
    loadResults();
</script>
</body>
</html>
