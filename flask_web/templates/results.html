<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }

        .status-card {
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }

        .status-card.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .status-card.alert {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .status-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #667eea;
        }

        .result-card h4 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #666;
        }

        .value {
            color: #333;
        }

        .incidents-section {
            margin-top: 30px;
        }

        .incidents-section h4 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .incident-item {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ffc107;
        }

        .incident-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .incident-time {
            font-weight: bold;
            color: #856404;
        }

        .incident-confidence {
            background: #ffc107;
            padding: 5px 10px;
            border-radius: 5px;
            color: #856404;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .loading-results {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .video-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .video-section h4 {
            color: #667eea;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
        .btn-exit {
            background: #dc3545;
            color: white;
        }

        .btn-exit:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Cheating Detection Results</h1>

        <div class="loading-results" id="loadingResults">
            <div class="spinner"></div>
            <p>Loading results...</p>
        </div>

        <div class="results-content" id="resultsContent" style="display: none;">
            <div class="status-card" id="statusCard">
                <div class="status-icon" id="statusIcon"></div>
                <h3 id="statusTitle"></h3>
                <p id="statusMessage"></p>
            </div>

            <div class="results-grid">
                <div class="result-card">
                    <h4>Video Information</h4>
                    <div class="info-item">
                        <span class="label">Total Frames:</span>
                        <span class="value" id="totalFrames"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Frames Analyzed:</span>
                        <span class="value" id="framesAnalyzed"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Processing Time:</span>
                        <span class="value" id="processingTime"></span>
                    </div>
                </div>

                <div class="result-card">
                    <h4>Detection Summary</h4>
                    <div class="info-item">
                        <span class="label">Total Persons:</span>
                        <span class="value" id="totalPersons"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Cheating Persons:</span>
                        <span class="value" id="cheatingPersons"></span>
                    </div>
                </div>
            </div>

            <div class="incidents-section" id="incidentsSection" style="display: none;">
                <h4>Detected Incidents</h4>
                <div class="incidents-list" id="incidentsList"></div>
            </div>

            <div class="video-section">
                <h4>Processed Video</h4>
                <video controls id="outputVideo">
                    <source src="{{ url_for('static', filename=output_video) }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="analyzeAnother">Analyze Another Video</button>
                <button class="btn btn-secondary" id="downloadReport">Download Report</button>
                <button class="btn btn-secondary" id="downloadVideo" style="background: #28a745; color: white;">Download Video</button>
                <button class="btn btn-exit" id="exitApp">Exit App</button>
            </div>
        </div>
    </div>

    <script>
    const result_summary_str = '{{ summary|safe }}';
    const filename = "{{ filename }}";
    const output_video = "{{ output_video }}";

    console.log('Raw summary string:', result_summary_str);
    console.log('Filename:', filename);
    console.log('Output video path:', output_video);

    // Parse the string to object
    let result_summary = {};
    try {
        result_summary = JSON.parse(result_summary_str);
        console.log('✓ Parsed result summary:', result_summary);
        console.log('  Total persons:', result_summary.total_persons);
        console.log('  Cheating persons:', result_summary.cheating_persons);
        console.log('  Total frames:', result_summary.total_frames);
    } catch (error) {
        console.error('❌ Failed to parse summary:', error);
        console.log('Raw summary string:', result_summary_str);
        result_summary = {
            total_persons: 0,
            cheating_persons: [],
            total_frames: 0,
            processing_time: 0
        };
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function loadResults() {
        document.getElementById('loadingResults').style.display = 'none';
        document.getElementById('resultsContent').style.display = 'block';

        console.log('Loading results with summary:', result_summary);

        // Check if data exists
        if (!result_summary || typeof result_summary !== 'object') {
            alert('Error: No summary data received from server');
            return;
        }

        // If backend error
        if (result_summary.error) {
            console.warn('Summary error:', result_summary.error);
            // Still show the UI with default values
        }

        // Status card
        const statusCard = document.getElementById('statusCard');
        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');

        if (result_summary.cheating_persons && result_summary.cheating_persons.length > 0) {
            statusCard.classList.add('alert');
            statusIcon.textContent = '⚠️';
            statusTitle.textContent = 'Cheating Detected';
            statusMessage.textContent = 
                `Detected ${result_summary.cheating_persons.length} suspicious individual(s).`;
        } else {
            statusCard.classList.add('success');
            statusIcon.textContent = '✅';
            statusTitle.textContent = 'No Cheating Detected';
            statusMessage.textContent = 'No suspicious behavior detected in the video.';
        }

        const totalFrames = result_summary.total_frames || 'N/A';
        const processingTime = result_summary.processing_time;
        const totalPersons = result_summary.total_persons || 0;
        const cheatingPersons = result_summary.cheating_persons ? result_summary.cheating_persons.length : 0;

        console.log('Setting UI values:');
        console.log('  Total frames:', totalFrames);
        console.log('  Processing time:', processingTime);
        console.log('  Total persons:', totalPersons);
        console.log('  Cheating persons:', cheatingPersons);

        document.getElementById('totalFrames').textContent = totalFrames;
        document.getElementById('framesAnalyzed').textContent = totalFrames;
        document.getElementById('processingTime').textContent = 
            processingTime ? `${processingTime.toFixed(2)}s` : 'N/A';
        document.getElementById('totalPersons').textContent = totalPersons;
        document.getElementById('cheatingPersons').textContent = cheatingPersons;

        // Show incidents if any
        if (result_summary.cheating_persons && result_summary.cheating_persons.length > 0) {
            const incidentsSection = document.getElementById('incidentsSection');
            const incidentsList = document.getElementById('incidentsList');

            incidentsSection.style.display = 'block';

            result_summary.cheating_persons.forEach(personId => {
                const item = document.createElement('div');
                item.className = 'incident-item';
                item.innerHTML = `
                    <div class="incident-info">
                        <span class="incident-time">Person ID: ${personId}</span>
                        <span class="incident-confidence">Flagged</span>
                    </div>
                `;
                incidentsList.appendChild(item);
            });
        }

        // Setup video with error handling
        setupVideo();
    }

    function setupVideo() {
        const videoElement = document.getElementById('outputVideo');
        const videoSource = videoElement.querySelector('source');
        
        console.log('Video source URL:', videoSource.src);

        // Add event listeners for video debugging
        videoElement.addEventListener('loadeddata', () => {
            console.log('✓ Video loaded successfully');
            console.log('  Duration:', videoElement.duration, 'seconds');
            console.log('  Dimensions:', videoElement.videoWidth, 'x', videoElement.videoHeight);
        });

        videoElement.addEventListener('error', (e) => {
            console.error('❌ Video loading error:', e);
            console.error('  Error code:', videoElement.error ? videoElement.error.code : 'unknown');
            console.error('  Error message:', videoElement.error ? videoElement.error.message : 'unknown');
            
            // Display error message to user
            const videoSection = document.querySelector('.video-section');
            videoSection.innerHTML = `
                <h4>Processed Video</h4>
                <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 10px; text-align: center;">
                    <p><strong>⚠️ Video Loading Error</strong></p>
                    <p>Could not load the processed video.</p>
                    <p style="font-size: 12px; margin-top: 10px;">Path: ${output_video}</p>
                    <p style="font-size: 12px;">Check browser console for details.</p>
                </div>
            `;
        });

        videoElement.addEventListener('loadstart', () => {
            console.log('Video loading started...');
        });

        videoElement.addEventListener('canplay', () => {
            console.log('✓ Video can play');
        });
    }
    // Handle Analyze Another Video button
    document.getElementById('analyzeAnother').addEventListener('click', async function() {
        const button = this;
        const originalText = button.textContent;
        
        // Show loading state
        button.textContent = 'Cleaning up...';
        button.disabled = true;

        try {
            // Delete files before navigating
            const response = await fetch(`/delete/${filename}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                console.log('✓ Files deleted successfully');
            } else {
                console.warn('⚠️ Some files may not have been deleted');
            }
            
            // Navigate to index page
            window.location.href = "{{ url_for('index') }}";
            
        } catch (error) {
            console.error('❌ Cleanup error:', error);
            // Still navigate to index even on error
            window.location.href = "{{ url_for('index') }}";
        }
    });

    // Handle Exit App button
    document.getElementById('exitApp').addEventListener('click', async function() {
        const button = this;
        const originalText = button.textContent;
        
        // Show loading state
        button.textContent = 'Exiting...';
        button.disabled = true;

        try {
            // Delete files before exiting
            const response = await fetch(`/delete/${filename}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                console.log('✓ Files deleted successfully');
            } else {
                console.warn('⚠️ Some files may not have been deleted');
            }
            
            window.close();
            
            setTimeout(() => {
                alert('You can now safely close this browser tab.');
            }, 500);
            
        } catch (error) {
            console.error('❌ Exit error:', error);
            window.close();
            setTimeout(() => {
                alert('You can now safely close this browser tab.');
            }, 500);
        }
    });


    document.getElementById('downloadReport').addEventListener('click', () => {
        let report = `CHEATING DETECTION REPORT\n`;
        report += `========================\n\n`;
        report += `Filename: ${filename}\n`;
        report += `Total Persons: ${result_summary.total_persons || 0}\n`;
        report += `Cheating Persons: ${result_summary.cheating_persons ? result_summary.cheating_persons.length : 0}\n`;
        report += `Total Frames: ${result_summary.total_frames || 0}\n`;
        report += `Processing Time: ${result_summary.processing_time ? result_summary.processing_time.toFixed(2) : 'N/A'}s\n\n`;
        
        if (result_summary.cheating_persons && result_summary.cheating_persons.length > 0) {
            report += `Cheating Person IDs:\n`;
            result_summary.cheating_persons.forEach(id => {
                report += `- Person ${id}\n`;
            });
        }

        // Download as text file
        const blob = new Blob([report], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `report_${filename}.txt`;
        a.click();
        window.URL.revokeObjectURL(url);
    });
    document.getElementById('downloadVideo').addEventListener('click', function() {
        const button = this;
        const downloadUrl = `/download_result/${filename}`;
        
        // Create temporary link to trigger download
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = downloadUrl;
        document.body.appendChild(a);
        a.click();
        
        // Cleanup
        setTimeout(() => {
            document.body.removeChild(a);
        }, 100);
    });

    // Load results on page load
    loadResults();
</script>
</body>
</html>
